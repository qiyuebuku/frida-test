plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yuyang.hook'
    compileSdk 34

    defaultConfig {
        applicationId "com.yuyang.hook"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'top.canyie.pine:core:0.3.0'
}
