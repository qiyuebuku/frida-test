[project]
name = "smart-fund-server"
version = "2.0.0"
description = "智能基金服务 — 数据聚合 + 交易决策 + 任务执行"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "psycopg2-binary",
    "sqlalchemy>=2.0",
    "httpx",
    "jettask-python",
    "prometheus-client",
    "click>=8.0",
    "pymilvus[milvus_lite]>=2.6",
    "openai-agents>=0.17,<1",
    "langfuse>=3.0",
    "openinference-instrumentation-openai-agents>=0.1",
    "networkx>=3.0",
    "graspologic-native>=1.2,<2",
    "setuptools<81",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]
