name: Smart Fund production deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "smart-fund-server/**"
      - "!smart-fund-server/docs/**"
      - "deploy.sh"
      - "ths/deployment/deploy.sh"
      - "ths/deployment/internal/**"

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'smart-fund-production' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml
      - name: Validate deployment shell scripts
        run: |
          bash -n deploy.sh ths/deployment/deploy.sh
          find ths/deployment/internal -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find ths/deployment/redroid -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate 1 trade + 8 collector topology
        run: |
          pytest -q -c /dev/null \
            ths/tests/test_workspace_deployment.py \
            ths/tests/test_ths_bridge_pool_config.py \
            ths/tests/test_redroid_deployment_contract.py
          cd ths && ./gradlew --no-daemon :app:assembleRelease -x lintVitalAnalyzeRelease

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.THS_PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.THS_PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ths-production
          chmod 600 ~/.ssh/ths-production
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy selected Git revision
        env:
          SSH_HOST: ${{ secrets.THS_PRODUCTION_HOST }}
          SSH_PORT: ${{ secrets.THS_PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.THS_PRODUCTION_SSH_USER }}
          REMOTE_SUDO_PASSWORD: ${{ secrets.THS_PRODUCTION_SUDO_PASSWORD }}
          DEPLOY_GIT_URL: ${{ secrets.DEPLOY_GIT_URL }}
        run: |
          install -d deployment
          {
            printf 'REMOTE_HOST=%q\n' "$SSH_HOST"
            printf 'REMOTE_PORT=%q\n' "$SSH_PORT"
            printf 'REMOTE_USER=%q\n' "$SSH_USER"
            printf 'SSH_KEY=%q\n' "$HOME/.ssh/ths-production"
            printf 'REMOTE_SUDO_PASSWORD=%q\n' "$REMOTE_SUDO_PASSWORD"
            printf 'DEPLOY_GIT_URL=%q\n' "$DEPLOY_GIT_URL"
          } > deployment/production.env
          chmod 600 deployment/production.env
          ./deploy.sh production --revision "$GITHUB_SHA"
