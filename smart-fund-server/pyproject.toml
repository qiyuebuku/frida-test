[project]
name = "smart-fund-server"
version = "2.0.0"
description = "智能基金服务 — 数据聚合 + 交易决策 + 任务执行"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "psycopg2-binary",
    "asyncpg",
    "sqlalchemy>=2.0",
    "httpx",
    "jettask-python @ file:///home/yuyang/easy-task/backend/jettask-rs/bindings/python/dist/jettask_python-0.1.0-py3-none-any.whl",
    "prometheus-client",
    "click>=8.0",
    "redis",
    "PyYAML",
    "akshare",
    "curl-cffi",
    "camoufox==0.4.11",
    "pymilvus[milvus_lite]>=2.6,<3",
    "milvus-lite>=2.5,<3",
    "langfuse>=3.0",
    "mcp>=1.27,<2",
    "networkx>=3.0",
    "graspologic-native>=1.2,<2",
    "setuptools<81",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]
