[project]
name = "smart-fund-server"
version = "2.0.0"
description = "智能基金服务 — 数据聚合 + 交易决策 + 任务执行"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "psycopg2-binary",
    "asyncpg",
    "sqlalchemy>=2.0",
    "httpx",
    "jettask-python @ file:///home/yuyang/easy-task/backend/jettask-rs/bindings/python/dist/jettask_python-0.1.0-py3-none-any.whl",
    "prometheus-client",
    "click>=8.0",
    "redis",
    "PyYAML",
    "akshare",
    "exchange-calendars>=4.11,<5",
    "curl-cffi",
    "camoufox==0.4.11",
    "pymilvus[milvus_lite]>=2.6,<3",
    "milvus-lite>=2.5,<3",
    "langfuse>=4.7,<5",
    "mcp>=1.27,<2",
    "openai-agents>=0.17,<0.18",
    "openai>=2.37,<2.41",
    "openinference-instrumentation-openai-agents>=1.5,<2",
    "pydantic>=2.12,<2.13",
    "networkx>=3.0",
    "graspologic-native>=1.2,<2",
    "setuptools<81",
    "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]
