services:
  gateway:
    image: ths-gateway:1.0.2
    build:
      context: ..
      dockerfile: redroid/gateway/Dockerfile
    container_name: ths-gateway
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    environment:
      THS_GATEWAY_PORT: ${THS_GATEWAY_PORT:-49350}
      THS_GATEWAY_STREAM_PORT: ${THS_GATEWAY_STREAM_PORT:-49352}
      THS_REDROID_UPSTREAM_DNS: ${THS_REDROID_UPSTREAM_DNS:-10.168.1.3}
      THS_DOCKER_BRIDGE: ${THS_DOCKER_BRIDGE:-docker0}
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import json,urllib.request;
          d=json.load(urllib.request.urlopen('http://127.0.0.1:${THS_GATEWAY_PORT:-49350}/lb/status',timeout=3));
          raise SystemExit(0 if d.get('healthy_backends',0)>0 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
